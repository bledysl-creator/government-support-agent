<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>정부지원사업 알림 대시보드</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--ink:#1d2330;--sub:#5d6675;--line:#e3e6eb;
        --fit:#1f7a4d;--fitbg:#e5f4ec;--rev:#9a6200;--revbg:#fdf1dc;--ex:#7a7f88;--exbg:#eef0f3;--urgent:#c0392b}
  @media (prefers-color-scheme:dark){:root{--bg:#14171c;--card:#1d2128;--ink:#e8eaee;--sub:#a0a7b3;--line:#2d323b;
        --fitbg:#173a29;--fit:#6fd3a0;--revbg:#3d2f12;--rev:#f0c06a;--exbg:#262a31;--ex:#a0a7b3;--urgent:#ff7b6b}}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
  header{padding:24px 20px 8px;max-width:1100px;margin:0 auto}
  h1{font-size:22px;margin:0 0 4px}
  .meta{color:var(--sub);font-size:14px}
  main{max-width:1100px;margin:0 auto;padding:8px 20px 40px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:16px 0}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .stat b{display:block;font-size:26px}
  .stat span{color:var(--sub);font-size:13px}
  .controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 16px}
  .controls button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 14px;border-radius:999px;cursor:pointer;font-size:14px}
  .controls button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .controls input{flex:1;min-width:180px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font-size:14px}
  .list{display:grid;gap:12px}
  .item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
  .top{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
  .title{font-weight:600;font-size:16px;margin:0}
  .title a{color:inherit;text-decoration:none}.title a:hover{text-decoration:underline}
  .badge{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .b-fit{background:var(--fitbg);color:var(--fit)}.b-rev{background:var(--revbg);color:var(--rev)}.b-ex{background:var(--exbg);color:var(--ex)}
  .dday{font-size:13px;font-weight:600;color:var(--sub);white-space:nowrap}.dday.urgent{color:var(--urgent)}
  .verdict{margin:8px 0 10px;font-size:14px}
  dl{display:grid;grid-template-columns:90px 1fr;gap:4px 12px;margin:0;font-size:14px}
  dt{color:var(--sub)}dd{margin:0}
  .empty{color:var(--sub);text-align:center;padding:40px 0}
  footer{color:var(--sub);font-size:12px;text-align:center;padding:20px}
</style>
</head>
<body>
<header>
  <h1>정부지원사업 알림 대시보드</h1>
  <div class="meta" id="meta">불러오는 중…</div>
</header>
<main>
  <div class="stats" id="stats"></div>
  <div class="controls" id="controls">
    <button data-f="active" class="on">꼭 맞음 + 검토 필요</button>
    <button data-f="꼭 맞음">꼭 맞음</button>
    <button data-f="검토 필요">검토 필요</button>
    <button data-f="제외">제외</button>
    <button data-f="all">전체</button>
    <input id="q" type="search" placeholder="사업명·기관 검색">
  </div>
  <div class="list" id="list"></div>
</main>
<footer>평일 오전 9시 자동 갱신 · 알림 전용이며 신청은 직접 하셔야 합니다</footer>
<script>
const today = new Date(new Date().toLocaleString("en-US",{timeZone:"Asia/Seoul"})); today.setHours(0,0,0,0);
let data = {updated:"", notices:[]}, filter = "active";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => /^https?:\/\//i.test(u||"") ? u : "#";
function dday(d){
  if(!d || !/^\d{4}-\d{2}-\d{2}$/.test(d)) return {txt: d || "상시", n: 9999};
  const n = Math.round((new Date(d+"T00:00:00") - today)/86400000);
  return {txt: n<0 ? "마감" : n===0 ? "D-Day" : "D-"+n, n};
}
const cls = v => v==="꼭 맞음" ? "b-fit" : v==="검토 필요" ? "b-rev" : "b-ex";
function render(){
  const q = document.getElementById("q").value.trim();
  const all = data.notices.filter(x => dday(x.마감일).n >= 0);
  const c = v => all.filter(x=>x.판정===v).length;
  document.getElementById("stats").innerHTML =
    `<div class="stat"><b>${c("꼭 맞음")}</b><span>꼭 맞음</span></div>`+
    `<div class="stat"><b>${c("검토 필요")}</b><span>검토 필요</span></div>`+
    `<div class="stat"><b>${all.filter(x=>x.판정!=="제외" && dday(x.마감일).n<=7).length}</b><span>7일 안에 마감</span></div>`+
    `<div class="stat"><b>${c("제외")}</b><span>제외</span></div>`;
  let rows = all.filter(x => filter==="all" || (filter==="active" ? x.판정!=="제외" : x.판정===filter));
  if(q) rows = rows.filter(x => (x.사업명+" "+x.기관).includes(q));
  rows.sort((a,b)=> (a.판정==="꼭 맞음"?0:1)-(b.판정==="꼭 맞음"?0:1) || dday(a.마감일).n - dday(b.마감일).n);
  document.getElementById("list").innerHTML = rows.length ? rows.map(x=>{
    const d = dday(x.마감일);
    return `<article class="item">
      <div class="top"><h2 class="title"><a href="${esc(safeUrl(x.링크))}" target="_blank" rel="noopener">${esc(x.사업명)}</a></h2>
      <div><span class="dday ${d.n<=7?"urgent":""}">${esc(d.txt)}</span> <span class="badge ${cls(x.판정)}">${esc(x.판정)}</span></div></div>
      <p class="verdict">${esc(x.한줄평)}</p>
      <dl><dt>기관</dt><dd>${esc(x.기관)}</dd>
      <dt>지원금액</dt><dd>${esc(x.지원금액)}</dd>
      <dt>신청기간</dt><dd>${esc(x.접수시작||"")} ~ ${esc(x.마감일)} ${esc(x.마감시각||"")}</dd>
      <dt>자격요건</dt><dd>${esc(x.자격요건)}</dd>
      <dt>수집처</dt><dd>${esc(x.수집처)}</dd></dl></article>`;
  }).join("") : `<div class="empty">조건에 맞는 공고가 없어요.</div>`;
}
document.getElementById("controls").addEventListener("click", e=>{
  if(!e.target.dataset.f) return;
  filter = e.target.dataset.f;
  document.querySelectorAll("#controls button").forEach(b=>b.classList.toggle("on", b===e.target));
  render();
});
document.getElementById("q").addEventListener("input", render);
fetch("notices.json?t="+Date.now()).then(r=>r.json()).then(j=>{
  data = j;
  document.getElementById("meta").textContent = `마지막 갱신: ${j.updated || "-"} · 대상: 서울·경기 의료기기 SW 소기업 (2018년 설립)`;
  render();
}).catch(()=>{document.getElementById("meta").textContent="데이터를 불러오지 못했어요."});
</script>
</body>
</html>
